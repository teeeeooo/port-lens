name: Windows Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows packages
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows packages
        run: npm run tauri build

      - name: Prepare portable executable
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          Copy-Item "src-tauri/target/release/port-lens.exe" "dist-portable/Port.Lens_${version}_x64-portable.exe"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: port-lens-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v6
        with:
          name: port-lens-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload portable executable
        uses: actions/upload-artifact@v6
        with:
          name: port-lens-windows-portable
          path: dist-portable/Port.Lens_*_x64-portable.exe
          if-no-files-found: error
